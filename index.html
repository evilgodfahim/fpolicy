<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geopolitics Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #4f8ef7;
      --accent2:   #7c5cbf;
      --text:      #dde1ee;
      --muted:     #7a7f96;
      --tag-bg:    #1e2236;
      --hover:     #1f2335;
      --radius:    8px;
      --font:      'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    header h1 span {
      color: var(--accent);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #search-box {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: var(--radius);
      outline: none;
      width: 220px;
      transition: border-color .2s;
    }
    #search-box:focus { border-color: var(--accent); }

    .rss-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e8540015;
      border: 1px solid #e8540040;
      color: #f4845f;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: var(--radius);
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s;
    }
    .rss-btn:hover { background: #e8540025; }
    .rss-btn svg { flex-shrink: 0; }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    /* ── Meta bar ───────────────────────────────────────────────────────── */
    #meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    #meta strong { color: var(--text); }

    /* ── Feed items ─────────────────────────────────────────────────────── */
    #feed { display: flex; flex-direction: column; gap: 1px; }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 8px;
      transition: background .15s, border-color .15s;
    }
    .item:hover { background: var(--hover); border-color: #3a3d52; }

    .item-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .item-title a {
      color: var(--text);
      text-decoration: none;
    }
    .item-title a:hover { color: var(--accent); }

    .item-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item-source {
      font-size: 0.75rem;
      color: var(--accent);
      background: #4f8ef710;
      border: 1px solid #4f8ef720;
      padding: 2px 8px;
      border-radius: 100px;
      white-space: nowrap;
    }

    .item-date {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Empty / error states ───────────────────────────────────────────── */
    #status {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 60px 0;
    }
    #status .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 520px) {
      #search-box { width: 140px; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌐 <span>Geopolitics</span> Feed</h1>
  <div class="header-right">
    <input id="search-box" type="search" placeholder="Filter headlines…" autocomplete="off" />
    <a class="rss-btn" href="feed/geopolitics.xml" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="6.18" cy="17.82" r="2.18"/>
        <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
      </svg>
      RSS Feed
    </a>
  </div>
</header>

<main>
  <div id="meta"></div>
  <div id="status">
    <div class="spinner"></div>
    Loading feed…
  </div>
  <div id="feed"></div>
</main>

<script>
const FEED_PATH = "feed/geopolitics.xml";

function extractHostname(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "");
  } catch { return ""; }
}

function relativeTime(dateStr) {
  const then = new Date(dateStr);
  if (isNaN(then)) return dateStr;
  const diffMs  = Date.now() - then.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1)  return "just now";
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24)  return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7)  return `${diffDay}d ago`;
  return then.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function parseItems(xmlDoc) {
  return Array.from(xmlDoc.querySelectorAll("item")).map(it => ({
    title:   it.querySelector("title")?.textContent || "",
    link:    it.querySelector("link")?.textContent || it.querySelector("guid")?.textContent || "",
    desc:    it.querySelector("description")?.textContent || "",
    pubDate: it.querySelector("pubDate")?.textContent || "",
  }));
}

function renderItems(items) {
  const feed = document.getElementById("feed");
  feed.innerHTML = items.map(d => `
    <div class="item">
      <div class="item-title">
        <a href="${d.link}" target="_blank" rel="noopener noreferrer">${d.title}</a>
      </div>
      ${d.desc ? `<div class="item-desc">${d.desc}</div>` : ""}
      <div class="item-meta">
        ${extractHostname(d.link) ? `<span class="item-source">${extractHostname(d.link)}</span>` : ""}
        ${d.pubDate ? `<span class="item-date">${relativeTime(d.pubDate)}</span>` : ""}
      </div>
    </div>
  `).join("");
}

async function loadFeed() {
  const statusEl = document.getElementById("status");
  const metaEl   = document.getElementById("meta");

  try {
    const res = await fetch(`${FEED_PATH}?_=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const xml  = new DOMParser().parseFromString(text, "application/xml");

    const parseErr = xml.querySelector("parsererror");
    if (parseErr) throw new Error("XML parse error");

    const lastBuild = xml.querySelector("lastBuildDate")?.textContent || "";
    const items     = parseItems(xml);

    metaEl.innerHTML = `
      <div><strong>${items.length}</strong> articles</div>
      ${lastBuild ? `<div>Updated <strong>${relativeTime(lastBuild)}</strong></div>` : ""}
    `;

    statusEl.style.display = "none";

    // Initial render
    renderItems(items);

    // Search
    document.getElementById("search-box").addEventListener("input", e => {
      const q = e.target.value.toLowerCase().trim();
      renderItems(q ? items.filter(d =>
        d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q)
      ) : items);
    });

  } catch (err) {
    statusEl.innerHTML = `
      <div style="color:#f4845f">
        Failed to load feed.<br>
        <small style="color:var(--muted)">${err.message}</small>
      </div>
    `;
  }
}

loadFeed();
</script>
</body>
</html>
