name: Geopolitics Feed

on:
  schedule:
    - cron: "0 * * * *"   # every hour on the hour
  workflow_dispatch:        # manual trigger from Actions UI

permissions:
  contents: write           # needed to push feed/geopolitics.xml and state/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/geopolitics.xml state/seen_guids.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: feed update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
